<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --c1:#18283F;--c2:#3C557B;--c3:#718EB3;--c4:#B0C9DA;--c5:#E4F1F5;
  --bg:#F4F8FA;--fg:#14233A;--card:#FFFFFF;--line:#E1E9EE;--muted:#66788A;
  --ok:#2E8B7A;--bad:#B5523B;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --r:16px;
  color-scheme:light;
}
body.dark{--bg:#0C1624;--fg:#E6EEF5;--card:#152335;--line:#243A54;--muted:#8DA3B8;color-scheme:dark}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:28px}h2{font-size:17px}
p{margin:0}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c2)}
body.dark .eyebrow{color:var(--c4)}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.card:hover{box-shadow:0 6px 20px -10px rgba(0,0,0,.18)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:1000px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;flex-direction:column;gap:10px}
.stat .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c3) 22%,transparent);color:var(--c2)}
body.dark .stat .ico{color:var(--c4)}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.warn .ico{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.stat.ok .ico{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

/* ---------- Buttons (realistic, not 3D) ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid color-mix(in srgb,#000 22%,var(--c2));background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 88%,#fff),var(--c2));color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18),0 3px 8px -3px rgba(0,0,0,.3);transition:transform .18s var(--spring),box-shadow .2s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.2),0 8px 16px -6px rgba(0,0,0,.35)}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 1px rgba(0,0,0,.15)}
.btn:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.btn.gh{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 90%,#000));color:var(--fg);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.1),0 3px 8px -4px rgba(0,0,0,.2)}
body.dark .btn.gh{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4)}
.btn.dg{background:linear-gradient(180deg,#C9725B,var(--bad));border-color:#8E3D29}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.btn.icon{width:40px;padding:0;min-height:40px}
.btn:disabled{opacity:.5;pointer-events:none}

/* ---------- Inputs ---------- */
.lbl{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--muted)}
.in{width:100%;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--c3);box-shadow:0 0 0 4px color-mix(in srgb,var(--c3) 22%,transparent)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- Chips / switch / tasks ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .18s var(--spring),background .2s,color .2s,border-color .2s;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chip:hover{border-color:var(--c3)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--c2);border-color:var(--c2);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex-shrink:0;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.switch[aria-checked=true]{background:var(--c2)}
.switch[aria-checked=true]::after{transform:translateX(18px)}
.pref{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px;transition:opacity .25s,transform .25s var(--ease)}
.task:hover{border-color:var(--c4)}
.task.done{opacity:.55}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-size:14px;font-weight:700;word-break:break-word}
.task.done .t b{text-decoration:line-through}
.task .t small{color:var(--muted);font-size:12px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--c3);background:var(--card);cursor:pointer;color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .2s var(--spring),background .2s}
.check:active{transform:scale(.86)}
.check.on{background:var(--c2);border-color:var(--c2)}
.check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.check.on svg{opacity:1}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c3) 20%,transparent);color:var(--c2);white-space:nowrap}
body.dark .tag{color:var(--c4)}
.tag.late{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;transition:color .2s,background .2s}
.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c2));transition:width .6s var(--ease)}
.block{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px;border-radius:14px;background:var(--bg);border-left:3px solid var(--c3);margin-bottom:8px}
.block.brk{border-left-color:var(--line);background:transparent;color:var(--muted);font-size:13px}
.block time{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.block b{font-size:14px;display:block}
.block small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}

/* ---------- Schedule days ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--line);border-radius:12px;padding:10px 2px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;transition:transform .18s var(--spring),background .2s,color .2s}
.day:active{transform:scale(.92)}
.day small{display:block;font-size:11px;color:var(--muted)}
.day b{font-size:17px}
.day[aria-pressed=true]{background:var(--c2);border-color:var(--c2);color:#fff}
.day[aria-pressed=true] small{color:#dfe8f2}

/* ---------- Timer ---------- */
.ring{position:relative;width:240px;height:240px;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--c2);transition:stroke-dashoffset .4s linear}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- Palette ---------- */
.pal{cursor:pointer;text-align:left;font:inherit;color:var(--fg);transition:transform .2s var(--spring),box-shadow .2s}
.pal:hover{transform:translateY(-2px)}
.pal.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c2)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);height:40px;border-radius:12px;overflow:hidden;margin:10px 0 8px}
.codes{display:grid;grid-template-columns:repeat(5,1fr);font-size:10px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{display:flex;gap:8px;margin-top:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--spring)}
.sw button:hover{transform:scale(1.12)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--c2)}

/* ---------- Auth ---------- */
#authV{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:420px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--c2);display:grid;place-items:center;color:var(--c5);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.2)}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;background:var(--card);border-right:1px solid var(--line);overflow:auto;z-index:20}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:background .2s,color .2s,transform .15s var(--spring)}
.nav:hover{background:color-mix(in srgb,var(--c3) 14%,transparent)}
.nav:active{transform:scale(.98)}
.nav[aria-current=page]{background:color-mix(in srgb,var(--c2) 12%,transparent);color:var(--c2);box-shadow:inset 3px 0 0 var(--c2)}
body.dark .nav[aria-current=page]{color:var(--c4)}
.nav .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--c1);background-size:cover;background-position:center;flex-shrink:0}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 24px;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .menu{display:none}
.content{padding:24px;padding-bottom:40px;max-width:1100px;width:100%}
.content>header{margin-bottom:18px}
.content>header p{color:var(--muted);margin-top:4px;font-size:14px}
.bottom{display:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-105%);transition:transform .4s var(--ease);box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.open{transform:none}
  .topbar .menu{display:inline-grid}
  .content{padding:16px 14px 120px}
  h1{font-size:24px}
  .stat b{font-size:22px}
  .bottom{display:flex;position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:30;gap:4px;padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
  .bottom button{flex:1;min-width:0;display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:8px 2px;border-radius:16px;cursor:pointer;transition:transform .2s var(--spring),background .25s,color .25s}
  .bottom button:active{transform:scale(.92)}
  .bottom button[aria-current=page]{background:var(--c2);color:#fff}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .ring{width:210px;height:210px}.ring .ctr{font-size:44px}
}
.scrim{display:none}
@media(max-width:860px){.scrim.show{display:block}}

/* ---------- Toasts / modal ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;display:grid;gap:8px;width:min(92vw,360px);pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);animation:tin .3s var(--ease)}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}}

/* ---------- LIQUID GLASS ---------- */
body.glass{background:
  radial-gradient(60vmax 60vmax at 10% 0%,color-mix(in srgb,var(--c3) 55%,transparent),transparent 60%),
  radial-gradient(55vmax 55vmax at 100% 100%,color-mix(in srgb,var(--c2) 60%,transparent),transparent 60%),
  radial-gradient(40vmax 40vmax at 60% 40%,color-mix(in srgb,var(--c4) 50%,transparent),transparent 60%),
  var(--bg);background-attachment:fixed}
body.glass .card,body.glass aside,body.glass .topbar,body.glass .bottom{background:color-mix(in srgb,var(--card) 42%,transparent);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-color:color-mix(in srgb,#fff 38%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 32px -14px rgba(0,0,0,.28)}
body.glass .topbar{background:color-mix(in srgb,var(--card) 30%,transparent)}
body.glass .btn{position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--c3) 55%,transparent),color-mix(in srgb,var(--c2) 45%,transparent));backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid rgba(255,255,255,.45);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.12),0 10px 22px -12px rgba(0,0,0,.45);transition:transform .25s var(--spring),box-shadow .3s var(--ease),filter .3s}
body.glass .btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none}
body.glass .btn:hover::before{transform:translateX(120%)}
body.glass .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 16px 30px -12px rgba(0,0,0,.45)}
body.glass .btn:active{transform:scale(.94);box-shadow:inset 0 3px 8px rgba(0,0,0,.2)}
body.glass .btn.gh{background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,.12));color:var(--fg);text-shadow:none}
body.dark.glass .btn.gh{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03));color:var(--fg)}
body.glass .btn.dg{background:linear-gradient(135deg,rgba(201,114,91,.8),rgba(181,82,59,.6))}
body.glass .chip{background:color-mix(in srgb,var(--card) 35%,transparent);backdrop-filter:blur(12px);border-color:rgba(255,255,255,.4);transition:transform .25s var(--spring),background .3s}
body.glass .chip:hover{transform:translateY(-1px)}
body.glass .chip[aria-pressed=true]{background:linear-gradient(135deg,color-mix(in srgb,var(--c2) 85%,transparent),color-mix(in srgb,var(--c3) 60%,transparent));border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body.glass .task{background:color-mix(in srgb,var(--card) 30%,transparent);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.3)}
body.glass .in{background:color-mix(in srgb,var(--card) 30%,transparent);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.35)}

/* --- show any runtime error on screen instead of a blank page --- */
function showFatal(err){
  const v=document.getElementById("view")||document.body;
  const msg=(err&&(err.stack||err.message))||String(err);
  v.innerHTML='<div class="card" style="margin:16px"><h2>Xatolik</h2><pre style="white-space:pre-wrap;font-size:12px;margin-top:8px">'+String(msg).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</pre><button class="btn" style="margin-top:12px" onclick="location.reload()">Qayta yuklash</button></div>';
}
window.addEventListener("error",e=>showFatal(e.error||e.message));
window.addEventListener("unhandledrejection",e=>showFatal(e.reason));

async function doLogin(id,pass){
  id=id.trim();
  if(!provCfg().email) throw new Error("Email orqali kirish o‘chirilgan");
  if(FB_ON){
    let email=id;
    if(!id.includes("@")){ const q=await fbDb.collection("users").where("username","==",id.toLowerCase()).limit(1).get(); if(q.empty) throw new Error("e_nouser"); email=q.docs[0].data().email; }
    await fbAuth.signInWithEmailAndPassword(email,pass); return;
  }
  const u=DB.users.find(x=>x.username===id.toLowerCase()||x.email.toLowerCase()===id.toLowerCase());
  if(!u) throw new Error("e_nouser");
  if(u.pass!==pass) throw new Error("e_wrongpw");
  DB.session=u.username; dbSave(); ME=u; fillLocal();
}
async function doRegister(d){
  if(SITE.regOpen===false) throw new Error("Ro‘yxatdan o‘tish yopiq");
  const st=defState(); st.goal=d.goal;
  if(FB_ON){
    const q=await fbDb.collection("users").where("username","==",d.username).limit(1).get();
    if(!q.empty) throw new Error("e_taken");
    const cred=await fbAuth.createUserWithEmailAndPassword(d.email,d.pass);
    await fbDb.collection("users").doc(cred.user.uid).set({username:d.username,name:d.name,email:d.email,role:"user",state:st});
    return;
  }
  if(DB.users.some(x=>x.username===d.username||x.email===d.email)) throw new Error("e_taken");
  const u={username:d.username,name:d.name,email:d.email,pass:d.pass,role:"user",state:st};
  DB.users.push(u); DB.session=u.username; dbSave(); ME=u; fillLocal();
}

function planBlocks(limit){
  const pending=ME.state.tasks.filter(x=>!x.done).sort((a,b)=>a.due-b.due||b.min-a.min);
  const brk={light:15,balanced:10,intense:5}[PLAN.mode], f={light:.8,balanced:1,intense:1.2}[PLAN.mode];
  let budget=PLAN.time; const out=[];
  for(const x of pending){
    if(budget<10) break;
    const take=Math.min(Math.round(x.min*f),budget);
    out.push({x,take}); budget-=take;
    if(budget>brk+10){ out.push({brk}); budget-=brk; }
  }
  return limit?out.slice(0,limit):out;
}

const hmToMin=s=>{const [h,m]=String(s||"0:0").split(":").map(Number);return h*60+m;};

function liveHTML(){
  const now=new Date(), nm=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const clock=[now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
  const list=todayLessons();
  if(!list.length) return `<div class="between"><b>${TL("Bugun darslar yo‘q","Сегодня нет уроков","No lessons today")}</b><span class="tag">${clock}</span></div>`;
  const cur=list.find(x=>hmToMin(x.start)<=nm && nm<hmToMin(x.end));
  const next=list.find(x=>hmToMin(x.start)>nm);
  let head, sub, pct=0, badge="";
  if(cur){
    const total=hmToMin(cur.end)-hmToMin(cur.start), left=Math.ceil(hmToMin(cur.end)-nm);
    pct=Math.round((nm-hmToMin(cur.start))/total*100);
    head=TL("Hozir: ","Сейчас: ","Now: ")+esc(cur.title);
    sub=TL(left+" daqiqa qoldi",left+" мин осталось",left+" min left");
    badge=`<span class="tag ok">${ic("timer",12)} ${esc(cur.start)}–${esc(cur.end)}</span>`;
  } else if(next){
    const before=nm<hmToMin(list[0].start);
    head=before?TL("Darslar hali boshlanmagan","Уроки ещё не начались","Classes not started"):TL("Tanaffus","Перемена","Break");
    sub=TL("Keyingi: ","Далее: ","Next: ")+esc(next.title)+" · "+esc(next.start)+" ("+Math.ceil(hmToMin(next.start)-nm)+" "+TL("daq","мин","min")+")";
    pct=0;
  } else {
    head=TL("Darslar tugadi","Уроки закончились","Classes finished"); sub=TL("Bugungi darslar yakunlandi","Сегодняшние уроки завершены","Today's classes are over"); pct=100;
  }
  return `<div class="between"><div style="min-width:0"><div class="eyebrow">${clock}</div><h2 style="margin-top:4px">${head}</h2><p class="muted small" style="margin-top:4px">${sub}</p></div>${badge}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

/* ---------- Alarm (budilnik) ---------- */
let AL={ac:null,iv:null,active:false,snoozeTo:0};
function alCtx(){
  if(!AL.ac){ try{AL.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(_){} }
  if(AL.ac&&AL.ac.state==="suspended") AL.ac.resume().catch(()=>{});
  return AL.ac;
}
const SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
function melodyOnce(){
  const c=alCtx(); if(!c) return;
  const start=c.currentTime, len=8+Math.floor(Math.random()*5);
  for(let i=0;i<len;i++){
    const o=c.createOscillator(), g=c.createGain(), s=start+i*0.16;
    o.type=["square","triangle","sawtooth"][Math.floor(Math.random()*3)];
    o.frequency.value=SCALE[Math.floor(Math.random()*SCALE.length)];
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.2,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.15);
    o.start(s); o.stop(s+.16);
  }
}
function beepOnce(){
  const c=alCtx(); if(!c) return;
  [0,.25,.5].forEach(d=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type="square"; o.frequency.value=880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.3,c.currentTime+d+.02);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.2);
    o.start(c.currentTime+d); o.stop(c.currentTime+d+.22);
  });
}

    const reg=await navigator.serviceWorker.ready;
    (await reg.getNotifications({tag:"alarm"})).forEach(n=>n.close());
    if(!al.on||!("TimestampTrigger" in window)||Notification.permission!=="granted") return;
    let tg=alTarget(al); if(tg<=new Date()) tg=new Date(tg.getTime()+864e5);
    await reg.showNotification(al.label||"Budilnik",{body:al.time,tag:"alarm",requireInteraction:true,vibrate:[300,150,300],showTrigger:new TimestampTrigger(tg.getTime())});
  }catch(_){}
}
function alarmCheck(){
  if(!ME||!ME.state||!ME.state.alarm) return;
  const now=new Date(), a=ME.state.alarm;
  if(AL.snoozeTo && Date.now()>=AL.snoozeTo){ AL.snoozeTo=0; ringAlarm(a.label||TL("Budilnik","Будильник","Alarm")); return; }
  if(!a.on) return;
  const tg=alTarget(a), day=now.toDateString();
  // rings at the set time, or catches up if the app was closed at that time (within 6h)
  if(now>=tg && now-tg<6*3600e3 && a.lastFired!==day){
    a.lastFired=day; saveState();
    ringAlarm(a.label||TL("Budilnik","Будильник","Alarm"));
  }
}

function guideShow(i){
  const prev=GD.i;
  document.querySelectorAll(".gslide").forEach(el=>{
    const n=Number(el.dataset.i);
    if(n===i){
      // incoming slide enters from the left, moving right
      el.style.transition="none"; el.classList.remove("out","on");
      void el.offsetWidth; el.style.transition="";
      el.classList.add("on");
    } else if(n===prev){
      // outgoing slide moves to the right
      el.classList.remove("on"); el.classList.add("out");
    } else {
      el.style.transition="none"; el.classList.remove("on","out");
      void el.offsetWidth; el.style.transition="";
    }
  });
  GD.i=i;
  document.querySelectorAll(".gdots i").forEach(el=>el.classList.toggle("on",Number(el.dataset.d)===i));
  const bar=document.getElementById("gBar");
  if(bar){ bar.style.animation="none"; void bar.offsetWidth; bar.style.animation=`gfill ${GUIDE_DUR[i]}ms linear forwards`; }
}
function guideStart(){
  clearTimeout(GD.to);
  guideShow(0);
  (function go(i){
    GD.to=setTimeout(()=>{ if(i+1<GUIDE_DUR.length){ guideShow(i+1); go(i+1); } }, GUIDE_DUR[i]);
  })(0);
}

  if(el.dataset.lang!==undefined){LANG=el.value;setLangPref();render();return;}

  if(el.id==="importIn"){ importBackup(el.files&&el.files[0]); return; }
  if(el.id==="photoIn"){
    const f=el.files&&el.files[0]; if(!f) return;
    const img=new Image(),url=URL.createObjectURL(f);
    img.onload=async()=>{const c=document.createElement("canvas");c.width=c.height=200;const m=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,200,200);
      URL.revokeObjectURL(url);
      try{
        if(FB_ON){
          const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
          const ref=firebase.storage().ref("avatars/"+ME.uid+".jpg");
          await ref.put(blob); ME.state.photo=await ref.getDownloadURL();
        } else ME.state.photo=c.toDataURL("image/jpeg",.85);
        saveState(); toast(t("t_saved")); render();
      }catch(err){ toast(err.message,true); }
    };
    img.src=url;
  }
});
document.addEventListener("input",e=>{
  if(e.target.dataset.act==="goal"){ME.state.goal=Number(e.target.value);saveState();renderView();}
});
document.addEventListener("submit",async e=>{
  const f=e.target; e.preventDefault();
  try{
    if(f.id==="loginForm"){
      const id=$("#lId").value.trim(),pass=$("#lPass").value;
      $("#eId").textContent=id?"":t("e_req"); $("#ePass").textContent=pass?"":t("e_req");
      if(!id||!pass) return;
      await doLogin(id,pass); toast(t("t_welcome")); render(); return;
    }
    if(f.id==="regForm"){
      const d={name:$("#rName").value.trim(),username:$("#rUser").value.trim().toLowerCase(),email:$("#rEmail").value.trim(),pass:$("#rPass").value,goal:Number($("#rGoal").value)};
      const p2=$("#rPass2").value, terms=$("#rTerms").checked;
      const errs={
        eName:d.name.length<3?t("e_req"):"",
        eUser:/^[a-z0-9_.]{3,20}$/.test(d.username)?"":t("e_user"),
        eEmail:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)?"":t("e_email"),
        ePass:d.pass.length>=8?"":t("e_pw"),
        ePass2:(p2&&p2===d.pass)?"":t("e_pw2"),
        eTerms:terms?"":t("e_terms")
      };
      Object.entries(errs).forEach(([k,v])=>$("#"+k).textContent=v);
      if(Object.values(errs).some(Boolean)) return;
      await doRegister(d); toast(t("t_reg")); render(); return;
    }
    if(f.id==="taskForm"){
      const title=$("#tTitle").value.trim();
      if(!title){toast(t("t_title"),true);return;}
      const s=ME.state;
      s.tasks.push({id:s.nextId++,title,subject:$("#tSubj").value,due:Number($("#tDue").value),min:Math.max(5,Number($("#tMin").value)||30),done:false});
      saveState(); toast(t("t_added")); render(); return;
    }
    if(f.id==="lessonForm"){
      const title=$("#lTitle").value.trim();
      if(!title){toast(X("subj_req"),true);return;}
      const st=ME.state; st.lessons=st.lessons||[];
      st.lessons.push({id:Date.now(),day:SCHED_DAY,start:$("#lStart").value||"08:00",end:$("#lEnd").value||"09:00",title,room:$("#lRoom").value.trim()});
      saveState(); toast(X("lesson_added")); render(); return;
    }
    if(f.id==="quickForm"){
      const title=$("#qTitle").value.trim();
      if(!title){toast(t("t_title"),true);return;}
      const s=ME.state;
      s.tasks.push({id:s.nextId++,title,subject:"",due:0,min:30,done:false});
      saveState(); toast(t("t_added")); render(); return;
    }
    if(f.id==="presetForm"){
      const min=Math.max(1,Math.min(600,Number($("#pMin").value)||15));
      const name=$("#pName").value.trim();
      ME.state.timers.push({kind:"custom",name,min});
      saveState(); toast(t("t_added")); renderView(); return;
    }
    if(f.id==="profForm"){
      const name=$("#pfName").value.trim(),email=$("#pfEmail").value.trim(),cur=$("#pfCur").value,np=$("#pfNew").value;
      if(name.length<3||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){$("#pfErr").textContent=t("e_req");return;}
      if(np){
        if(np.length<8){$("#pfErr").textContent=t("e_pw");return;}
        if(FB_ON){try{const u=fbAuth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(np);}catch(_){$("#pfErr").textContent=t("e_wrongpw");return;}}
        else{if(cur!==ME.pass){$("#pfErr").textContent=t("e_wrongpw");return;}ME.pass=np;}
      }
      ME.name=name; ME.email=email;
      if(FB_ON) await fbDb.collection("users").doc(ME.uid).update({name,email});
      else{const u=DB.users.find(x=>x.username===ME.username);if(u){u.name=name;u.email=email;u.pass=ME.pass;}dbSave();}
      toast(t("t_saved")); render(); return;
    }
    if(f.id==="siteForm"){
      SITE={name:$("#siName").value.trim()||"Evelora",desc:$("#siDesc").value.trim()};
      if(FB_ON) await fbDb.collection("site").doc("main").set(SITE); else{DB.site=SITE;dbSave();}
      toast(t("t_saved")); render(); return;
    }
    if(f.id==="notifForm"){
      const title=$("#nTitle").value.trim(); if(!title){toast(t("t_title"),true);return;}
      await sendNotif(title,$("#nText").value.trim()); toast(t("t_sent")); render(); return;
    }
  }catch(err){
    const k=err&&err.message;
    toast(TX[k]?t(k):(err&&err.message)||"Error",true);
  }
});

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
try{ boot(); }catch(e){ showFatal(e); }

/* ---------- Drawer + sliding bottom nav ---------- */
function setDrawer(v){
  DRAWER=!!v;
  $("#side").classList.toggle("open",DRAWER);
  $("#scrim").classList.toggle("show",DRAWER);
  $("#botNav").classList.toggle("sunk",DRAWER);
  document.body.classList.toggle("noscroll",DRAWER);
  const b=$("#botNav").querySelector('[data-act="drawer"]');
  if(b){b.setAttribute("aria-current",DRAWER?"page":"false");placeInd();}
}
function placeInd(){
  const bn=$("#botNav"),ind=bn.querySelector(".ind"),cur=bn.querySelector('button[aria-current="page"]')||bn.querySelector("button");
  if(!ind||!cur)return;
  ind.style.left=cur.offsetLeft+"px";ind.style.width=cur.offsetWidth+"px";
}
(function(){
  const bn=document.getElementById("botNav");let drag=null;
  const btns=()=>[...bn.querySelectorAll("button[data-k]")];
  const nearest=c=>{let best=null,bd=1e9;btns().forEach(b=>{const d=Math.abs(b.offsetLeft+b.offsetWidth/2-c);if(d<bd){bd=d;best=b;}});return best;};
  bn.addEventListener("pointerdown",e=>{
    const ind=bn.querySelector(".ind");if(!ind)return;
    const r=bn.getBoundingClientRect();
    drag={x:e.clientX,moved:false,off:e.clientX-r.left-(ind.offsetLeft+ind.offsetWidth/2)};
  });
  bn.addEventListener("pointermove",e=>{
    if(!drag)return;
    if(!drag.moved){if(Math.abs(e.clientX-drag.x)<6)return;drag.moved=true;try{bn.setPointerCapture(e.pointerId);}catch(_){}}
    const ind=bn.querySelector(".ind"),r=bn.getBoundingClientRect();
    ind.classList.add("drag");
    const bs=btns(),first=bs[0],last=bs[bs.length-1];
    const lo=first.offsetLeft+ind.offsetWidth/2,hi=last.offsetLeft+last.offsetWidth-ind.offsetWidth/2;
    const c=Math.max(lo,Math.min(hi,e.clientX-r.left-drag.off));
    ind.style.left=(c-ind.offsetWidth/2)+"px";
    const n=nearest(c);bs.forEach(b=>b===n?b.setAttribute("data-hot",""):b.removeAttribute("data-hot"));
  });
  const end=()=>{
    if(!drag)return;const d=drag;drag=null;
    const ind=bn.querySelector(".ind");btns().forEach(b=>b.removeAttribute("data-hot"));
    if(ind)ind.classList.remove("drag");
    if(!d.moved||!ind)return;
    bn.dataset.swiped="1";setTimeout(()=>delete bn.dataset.swiped,80);
    const best=nearest(ind.offsetLeft+ind.offsetWidth/2);
    if(best&&best.dataset.k!==TAB)best.click();
    placeInd();
  };
  bn.addEventListener("pointerup",end);
  bn.addEventListener("pointercancel",end);
  bn.addEventListener("click",e=>{if(bn.dataset.swiped){e.stopPropagation();e.preventDefault();}},true);
  window.addEventListener("resize",placeInd);
})();

if(window.ResizeObserver){new ResizeObserver(()=>placeInd()).observe(document.getElementById("botNav"));}
window.addEventListener("load",()=>{placeInd();setTimeout(placeInd,300);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);
})();
</script>
